
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foodie - Online Food Ordering</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>🍔 Foodie</h1>
        <p>Delicious Food, Delivered to You!</p>

        <nav>
            <a href="#home">Home</a>
            <a href="#menu">Food Menu</a>
            <a href="#cart">My Cart (<span id="cart-count">0</span>)</a>
        </nav>
    </header>

    <main>
        <section id="home">
            <h2>Welcome to Foodie!</h2>
            <p>Discover your favourite food and order online.</p>
        </section>

        <section id="menu">
            <h2>Our Food Menu</h2>

            <input
                type="text"
                id="search"
                placeholder="Search food by name..."
            >

            <select id="category-filter">
                <option value="all">All Categories</option>
                <option value="Pizza">Pizza</option>
                <option value="Burger">Burger</option>
                <option value="Drinks">Drinks</option>
                <option value="Dessert">Dessert</option>
            </select>

            <div id="food-list">
                <!-- Food items will be displayed here -->
            </div>
        </section>

        <section id="cart">
            <h2>🛒 My Shopping Cart</h2>

            <div id="cart-items">
                Your cart is empty.
            </div>

            <h3>Total: ₹<span id="total">0</span></h3>
        </section>

        <section id="checkout">
            <h2>Customer Details</h2>

            <form id="order-form">
                <label for="customer-name">Full Name:</label>
                <input
                    type="text"
                    id="customer-name"
                    required
                    placeholder="Enter your name"
                >

                <label for="customer-phone">Phone Number:</label>
                <input
                    type="tel"
                    id="customer-phone"
                    required
                    pattern="[0-9]{10}"
                    maxlength="10"
                    placeholder="10-digit phone number"
                >

                <label for="customer-address">Delivery Address:</label>
                <textarea
                    id="customer-address"
                    required
                    placeholder="Enter your delivery address"
                ></textarea>

                <button type="submit">Place Order</button>
            </form>

            <p id="order-message" role="status"></p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Foodie Online Food Ordering Website</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
